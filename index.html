<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F8EE; --card:#FFFFFF; --ink:#174A2E; --muted:#5E7365; --line:#DCE7D0;
    --accent:#DB6310; --accent-soft:#FDE8D5; --leaf:#2F7A4F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
  header{padding:22px 0 8px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0;line-height:1}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:14px;margin:6px 0 0}
  .tabs{display:flex;gap:6px;margin:18px 0 14px;background:#E3EDD8;padding:4px;border-radius:14px}
  .tab{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
  .tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .count{display:inline-block;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;margin-left:4px}
  .find{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  .find label{font-weight:600;font-size:14px;display:block;margin-bottom:8px}
  .row{display:flex;gap:8px}
  input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink)}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;background:var(--ink);color:#fff;white-space:nowrap}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:8px}
  .lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
  .card.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .pic{position:relative;display:block;line-height:0}
  .pic svg{width:100%;height:auto;display:block}
  .badges{position:absolute;left:10px;top:10px;display:flex;gap:5px;line-height:1}
  .plat{font-size:11px;font-weight:700;padding:4px 8px;border-radius:7px;color:#fff;letter-spacing:.02em;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .new{font-size:11px;font-weight:700;padding:4px 8px;border-radius:7px;background:#E8F3EC;color:var(--leaf)}
  .play{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(23,74,46,.85);display:grid;place-items:center;color:#fff;font-size:14px;line-height:1;padding-left:2px}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
  .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:18px;line-height:1.2;margin:0}
  .by{font-size:12.5px;color:var(--muted)}
  .blurb{font-size:14px;line-height:1.45;margin:0;color:#2B4335}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--muted);font-weight:500}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:15px;line-height:1.5}

  .out{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:10px}
  .note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
  .status{font-size:13px;color:var(--muted);margin:4px 0 10px;min-height:18px}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}

  .rec{border-top:1px solid var(--line);padding-top:10px;font-size:14.5px;line-height:1.5}

  .rec li{margin:4px 0}
  .rec .txt{white-space:pre-wrap}
  .rec .foot{font-size:12.5px;color:var(--muted);margin-top:6px}
  .pick.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  .bar{height:8px;border-radius:6px;background:var(--bg);margin-top:10px;overflow:hidden}

  .from{font-weight:600;color:var(--ink);margin-top:-4px}
  .tally{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--ink);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;border:0;width:100%;text-align:left}
  .tally b{font-size:17px;display:block}
  .tally .r{text-align:right;font-weight:700;white-space:nowrap}
  .tally.over{background:var(--accent)}
  .tab{padding:10px 4px;font-size:14px;white-space:nowrap}
  .heart{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:19px;line-height:1;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.2);padding:0}
  .heart.on{color:var(--accent)}
  .picwrap{position:relative}
  .kcal{font-size:13px;color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:5px 9px;align-self:flex-start}
  .price{font-weight:700;color:var(--leaf)}
  .item .p{margin-left:auto;padding-left:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-top:14px}
  .ingl{list-style:none;padding:0 !important}
  .ingl li{display:flex;gap:10px;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);margin:0 !important}
  .ingl b{font-variant-numeric:tabular-nums;color:var(--leaf);white-space:nowrap}
  .item small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .aisle{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
  .item{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35;cursor:pointer}
  .item input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--accent)}
  .item.done span{text-decoration:line-through;color:var(--muted)}
  .have{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.45}
  .cook{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
  .cook .head{display:flex;gap:12px;align-items:center;padding:12px 14px}
  .cook .thumb{flex:none;width:96px;border-radius:12px;overflow:hidden;line-height:0}

  .cook .steps{border-top:1px solid var(--line);padding:14px;white-space:pre-wrap;font-size:15px;line-height:1.55}
  .cook .foot{padding:0 14px 14px;font-size:12.5px;color:var(--muted)}
  .cook .foot a{color:var(--accent);font-weight:600}
  .cook .row{padding:0 14px 14px;flex-wrap:wrap}
</style>
</head>

      else if (shape === 'half') { const [x,y] = pt(9); o.push(`<path d="M${f(x - 9)} ${f(y)}a9 9 0 0 1 18 0z" fill="${c}" transform="rotate(${rot} ${f(x)} ${f(y)})"/>`); }
      else if (shape === 'strip') { const [x,y] = pt(16), d = 10 + rnd() * 10; o.push(`<path d="M${f(x - 18)} ${f(y)}q9 ${f(-d)} 18 0t18 0" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round" transform="rotate(${rot} ${f(x)} ${f(y)})"/><path d="M${f(x - 18)} ${f(y)}q9 ${f(-d)} 18 0t18 0" fill="none" stroke="#2A1E16" stroke-opacity=".10" stroke-width="1" transform="rotate(${rot} ${f(x)} ${f(y)}) translate(0 2.6)"/>`); }
      else if (shape === 'fillet') { const [x,y] = pt(26), tilt = -25 + rnd() * 50; o.push(`<rect x="${f(x - 26)}" y="${f(y - 13)}" width="52" height="26" rx="12" fill="${c}" transform="rotate(${f(tilt)} ${f(x)} ${f(y)})"/><path d="M${f(x - 14)} ${f(y - 5)}h28M${f(x - 14)} ${f(y + 4)}h28" stroke="#2A1E16" stroke-opacity=".14" stroke-width="2" stroke-linecap="round" transform="rotate(${f(tilt)} ${f(x)} ${f(y)})"/>`); }
      else if (shape === 'drizzle') { const a = areas[0], cx = a.r ? a.x : a.x + a.w / 2, cy = a.r ? a.y : a.y + a.h / 2, w = a.r ? a.r * .8 : a.w * .42; o.push(`<path d="M${f(cx - w)} ${f(cy - 14)}q${f(w / 2)} -22 ${f(w)} 0t${f(w)} 0M${f(cx - w)} ${f(cy + 12)}q${f(w / 2)} -22 ${f(w)} 0t${f(w)} 0" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" opacity=".9"/>`); }
    }
  }
  const box = document.createElement('div');
  box.innerHTML = `<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of ${r.n.replace(/[<>&"]/g, '')}">${o.join('')}</svg>`;
  return box.firstChild;
}

async function makeRecipe(r){
  if (!sampleNs || recipeBusy[r.id]) return;
  recipeBusy[r.id] = true; recipes[r.id] = ''; render();
  const prompt = `Write a clear home-cook recipe, in your own words, for this dish: "${r.n}" (${r.b})
Keep it easy: as few ingredients as the dish allows (aim for 8 or fewer, not counting oil, salt and pepper) and no more than 6 steps. For 2 servings, UK English, metric units, UK supermarket ingredient names. Plain text only, no markdown symbols. Use exactly this layout:
TIME: prep and cook minutes
YOU NEED:
• one ingredient with quantity per line
STEPS:
1. short, specific steps with heat levels, timings and what to look for
TIPS:
• up to 3 lines: a swap, how to store or reheat, and how to add protein or cut calories if relevant
No intro or outro.`;
  try {
    await sampleNs(prompt, {cache:true, onText: ({text}) => { recipes[r.id] = text; const o = document.getElementById('steps-' + r.id); if (o) o.textContent = text; }});
    try { localStorage.setItem('rr-recipes', JSON.stringify(recipes)); } catch(e){}
  } catch(err) {
    if (!recipes[r.id]) recipes[r.id] = err && err.code === 'rate_limited' ? 'Busy right now. Try again in a minute.' : 'Couldn’t write that one. Try again.';
  }
  recipeBusy[r.id] = false; render();
}

let clearArmed = false, clearTimer = null;
function clearAll(){
  if (!clearArmed) { clearArmed = true; render(); clearTimeout(clearTimer); clearTimer = setTimeout(() => { clearArmed = false; render(); }, 4000); return; }
  clearTimeout(clearTimer); clearArmed = false;
  S.picks = []; S.extra = [];
  render(); scheduleSave();
}

function togglePick(r){
  const i = S.picks.indexOf(r.id);
  if (i >= 0) { S.picks.splice(i,1); S.extra = S.extra.filter(x => x.id !== r.id); }
  else { S.picks.push(r.id); if (!LIB.some(x => x.id === r.id) && !S.extra.some(x => x.id === r.id)) S.extra.push({...r, isNew:false}); }
  render();
  scheduleSave();
}

function scheduleSave(){
  try { localStorage.setItem('rr-picks', JSON.stringify(S)); saveNote = ''; }
  catch(e) { saveNote = 'Your week is kept while this page is open.'; }
}

function clean(arr){
  if (!Array.isArray(arr)) return [];
  const names = new Set([...LIB, ...found, ...S.extra].map(r => r.n.toLowerCase()));
  return arr.filter(x => x && typeof x.name === 'string' && !names.has(x.name.toLowerCase())).slice(0, 8).map((x, i) => {
    const w = WEBNAMES[x.source] || null;
    return {
      id: 'ai-' + Date.now().toString(36) + '-' + i,
      n: x.name.slice(0, 80),
      k: KINDS[x.kind] ? x.kind : 'plate',
      w, p: w ? null : (['TikTok','Instagram','Both'].includes(x.source) ? x.source : 'Both'),
      c: typeof x.creator === 'string' ? x.creator.slice(0, 40) : '',
      b: String(x.blurb || '').slice(0, 220),
      t: Array.isArray(x.tags) ? x.tags.filter(t => TAGS.includes(t)) : [],
      m: Number(x.mins) || null,
      cost: Number(x.cost) > 0 && Number(x.cost) < 20 ? Math.round(Number(x.cost) * 100) / 100 : null,
      q: String(x.search || x.name).slice(0, 80),
      isNew: true
    };
  });
}

async function findMore(){
  if (finding || !sampleNs) return;
  const typed = $('#q') ? $('#q').value.trim() : '';
  const q = typed || 'surprise me with a mix of currently popular ones';
  finding = true; render();
  $('#q').value = typed;
  $('#findStatus').replaceChildren(el('span', {class:'spinner'}), 'Looking for recipes…');
  const skip = [...LIB, ...found, ...S.extra].map(r => r.n).join('; ');
  const scope = srcFilter === 'all' ? 'a mix of viral TikTok/Instagram reels and recipes from the listed UK recipe sites' : srcFilter === 'reels' ? 'viral TikTok/Instagram reels only' : 'recipes from ' + WEB[srcFilter].n + ' only';
  const prompt = `You help a UK home cook discover recipes from short-video platforms and well-known recipe sites.
Request: ${q}
Suggest 6 real, recognisable recipes that fit the request: ${scope}. Reel suggestions must be recipes that genuinely went viral; site suggestions must be recipes that really exist on that site under that name. Do not suggest any of these: ${skip}.
Return ONLY a JSON array of 6 objects with keys:
"name" (recipe name as published or as people search it),
"source" (one of: TikTok, Instagram, Both, ${Object.keys(WEBNAMES).join(', ')}),
"creator" (an @handle or chef name ONLY if you are certain, otherwise ""),
"blurb" (one sentence, max 22 words, what it is and why people love it, UK English),
"tags" (array chosen only from: ${TAGS.join(', ')}), "mins" (approx total minutes, number),
"cost" (estimated cost per serving in GBP as a number, using UK budget-supermarket own-brand prices),
"kind" (the closest of: ${Object.keys(KINDS).join(', ')}),
"search" (2-6 word phrase that finds it).`;
  try {
    const res = await sampleNs.json(prompt, {modelTier:'default'});
    const items = clean(Array.isArray(res) ? res : (res && res.recipes));
    found = [...items, ...found];
    filter = 'All';
    finding = false; render();
    $('#findStatus').textContent = items.length ? `Added ${items.length} new ideas at the top.` : 'No new ideas came back. Try different words.';
  } catch(err) {
    finding = false; render();
    const s = $('#findStatus');
    if (err && err.code === 'not_granted') { sampleNs = null; render(); }
    else if (s) s.textContent = err && err.code === 'rate_limited' ? 'Too many searches just now. Try again in a minute.' : 'That didn’t work. Try again.';
  }
}
